<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">William Jiamin profile showcase</title>
  <desc id="desc">An animated profile card highlighting AI apps, learning systems, and creative tools.</desc>
  <defs>
    <linearGradient id="bg" x1="78" y1="32" x2="1092" y2="514" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.52" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(196 108) rotate(72.07) scale(236 236)">
      <stop stop-color="#F97316" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1004 452) rotate(90) scale(220 260)">
      <stop stop-color="#2563EB" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40" y="-40" width="1280" height="680" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dy="18"/>
      <feGaussianBlur stdDeviation="18"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.0588235 0 0 0 0 0.0941176 0 0 0 0 0.172549 0 0 0 0.13 0"/>
      <feBlend in2="SourceGraphic" result="shape"/>
    </filter>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#0F172A" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <g filter="url(#shadow)">
    <rect x="20" y="20" width="1160" height="560" rx="36" fill="url(#bg)"/>
    <rect x="20" y="20" width="1160" height="560" rx="36" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="20" y="20" width="1160" height="560" rx="36" fill="url(#dots)"/>
  </g>

  <circle cx="196" cy="108" r="210" fill="url(#glowLeft)">
    <animate attributeName="cx" values="196;220;196" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1004" cy="476" r="240" fill="url(#glowRight)">
    <animate attributeName="cy" values="476;452;476" dur="10s" repeatCount="indefinite"/>
  </circle>

  <path d="M700 456C776 380 920 368 1048 434" stroke="#0F172A" stroke-opacity="0.12" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 14"/>
  <circle r="8" fill="#F97316">
    <animateMotion dur="7s" repeatCount="indefinite" path="M700 456C776 380 920 368 1048 434"/>
  </circle>

  <g>
    <text x="78" y="90" fill="#0F172A" font-size="18" font-family="Trebuchet MS, Verdana, sans-serif" letter-spacing="3">WILLIAM JIAMIN // PUBLIC WORKSHOP</text>
    <text x="78" y="188" fill="#0F172A" font-size="64" font-weight="700" font-family="Trebuchet MS, Verdana, sans-serif">AI apps</text>
    <text x="78" y="266" fill="#0F172A" font-size="64" font-weight="700" font-family="Trebuchet MS, Verdana, sans-serif">Learning systems</text>
    <text x="78" y="344" fill="#0F172A" font-size="64" font-weight="700" font-family="Trebuchet MS, Verdana, sans-serif">Creative tools</text>
    <text x="78" y="406" fill="#334155" font-size="26" font-family="Trebuchet MS, Verdana, sans-serif">Code, design, education, and public experiments.</text>
    <text x="78" y="442" fill="#64748B" font-size="22" font-family="Courier New, monospace">Useful things with clarity and personality.</text>
  </g>

  <g transform="translate(730 74)">
    <animateTransform attributeName="transform" type="translate" values="730 74;730 58;730 74" dur="6.5s" repeatCount="indefinite"/>
    <rect width="376" height="132" rx="24" fill="#FFFFFF" fill-opacity="0.82"/>
    <rect x="1.5" y="1.5" width="373" height="129" rx="22.5" stroke="#E2E8F0" stroke-width="3"/>
    <rect x="24" y="24" width="70" height="12" rx="6" fill="#14B8A6"/>
    <text x="24" y="58" fill="#0F172A" font-size="28" font-weight="700" font-family="Trebuchet MS, Verdana, sans-serif">CURRENT</text>
    <text x="24" y="88" fill="#334155" font-size="20" font-family="Trebuchet MS, Verdana, sans-serif">SimpleBible //</text>
    <text x="24" y="114" fill="#334155" font-size="20" font-family="Trebuchet MS, Verdana, sans-serif">AI study guide, voice, and search</text>
  </g>

  <g transform="translate(780 240)">
    <animateTransform attributeName="transform" type="translate" values="780 240;780 252;780 240" dur="7.8s" repeatCount="indefinite"/>
    <rect width="332" height="122" rx="22" fill="#0F172A"/>
    <rect x="22" y="22" width="56" height="10" rx="5" fill="#F97316"/>
    <text x="22" y="58" fill="#F8FAFC" font-size="26" font-weight="700" font-family="Trebuchet MS, Verdana, sans-serif">RECENT</text>
    <text x="22" y="84" fill="#CBD5E1" font-size="19" font-family="Trebuchet MS, Verdana, sans-serif">Simple-Pattern //</text>
    <text x="22" y="108" fill="#CBD5E1" font-size="19" font-family="Trebuchet MS, Verdana, sans-serif">design-forward iOS utility</text>
  </g>

  <g transform="translate(680 394)">
    <animateTransform attributeName="transform" type="translate" values="680 394;680 382;680 394" dur="6.9s" repeatCount="indefinite"/>
    <rect width="392" height="126" rx="22" fill="#FFFFFF" fill-opacity="0.88"/>
    <rect x="1.5" y="1.5" width="389" height="123" rx="20.5" stroke="#DBEAFE" stroke-width="3"/>
    <circle cx="38" cy="38" r="12" fill="#2563EB"/>
    <text x="66" y="44" fill="#0F172A" font-size="24" font-weight="700" font-family="Trebuchet MS, Verdana, sans-serif">ALWAYS IN THE MIX</text>
    <text x="24" y="78" fill="#334155" font-size="18" font-family="Trebuchet MS, Verdana, sans-serif">Python, Swift, education repos,</text>
    <text x="24" y="102" fill="#334155" font-size="18" font-family="Trebuchet MS, Verdana, sans-serif">product polish, and creative exploration</text>
  </g>

  <g transform="translate(78 518)">
    <rect x="0" y="0" width="124" height="34" rx="17" fill="#0F172A"/>
    <text x="24" y="22" fill="#F8FAFC" font-size="16" font-family="Courier New, monospace">Swift</text>

    <rect x="138" y="0" width="136" height="34" rx="17" fill="#0F172A"/>
    <text x="162" y="22" fill="#F8FAFC" font-size="16" font-family="Courier New, monospace">Python</text>

    <rect x="288" y="0" width="172" height="34" rx="17" fill="#0F172A"/>
    <text x="312" y="22" fill="#F8FAFC" font-size="16" font-family="Courier New, monospace">GitHub Pages</text>

    <rect x="474" y="0" width="160" height="34" rx="17" fill="#0F172A"/>
    <text x="498" y="22" fill="#F8FAFC" font-size="16" font-family="Courier New, monospace">Jupyter</text>

    <rect x="648" y="0" width="188" height="34" rx="17" fill="#0F172A"/>
    <text x="672" y="22" fill="#F8FAFC" font-size="16" font-family="Courier New, monospace">UI experiments</text>
  </g>
</svg>
